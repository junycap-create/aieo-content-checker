<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message House - AIEO & GEO Content Optimizer</title>
    <meta name="description" content="AI 검색 최적화(AIEO) 및 생성형 엔진 최적화(GEO) 진단 도구. 당신의 브랜드 메시지가 AI 답변의 출처가 되도록 설계하세요." />
    
    <!-- AI Crawler & SEO Meta Tags -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta property="og:title" content="Message House - AIEO & GEO Content Optimizer" />
    <meta property="og:description" content="ChatGPT, Gemini, Perplexity를 위한 인용 최적화 솔루션" />
    <meta property="og:type" content="website" />
    
    <!-- Structured Data for AI Readiness (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "AIEO Content Checker",
      "operatingSystem": "Web",
      "applicationCategory": "BusinessApplication",
      "description": "AI Search Engine Optimization tool for PR and Marketing content.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KRW"
      },
      "author": {
        "@type": "Organization",
        "name": "Message House"
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (window.tailwind) {
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
                mono: ['JetBrains Mono', 'monospace'],
              },
            },
          },
        };
      }
      const originalWarn = console.warn;
      console.warn = (...args) => {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        originalWarn.apply(console, args);
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #18181b; }
      h1, h2, h3, h4, h5, h6, .font-mono { font-family: 'JetBrains Mono', monospace; }
      .recharts-responsive-container { min-width: 0; min-height: 0; }
      @media print { .no-print { display: none !important; } }
    </style>
    <script>
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      if (!window.process.env.NODE_ENV) window.process.env.NODE_ENV = 'production';
      if (typeof window.process.env.API_KEY === 'undefined') window.process.env.API_KEY = '';
    </script>
    <script type="importmap">
    {
      "imports": {
        "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
        "react/": "https://aistudiocdn.com/react@^19.2.1/",
        "react": "https://aistudiocdn.com/react@^19.2.1",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
